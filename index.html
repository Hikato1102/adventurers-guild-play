    <!-- 頂部：日曆／金幣聲譽 -->

            <button type="button" class="soft-pill day" id="btn-day" title="日曆">
        <img class="pill-ico" src="assets/ui/day-badge.png?v=1794068400" alt="" aria-hidden="true" />
        <span class="pill-stack">
          <strong id="day-label">第9日 星期二</strong>
          <small><img class="inline-ico" id="weather-ico" src="assets/ui/weather-sunny.png?v=1794068400" alt="" /><span id="weather-label">晴</span> · <img class="inline-ico" id="tod-ico" src="assets/ui/time-noon.png?v=1794068400" alt="" /><span id="tod-label">正午</span> · <img class="inline-ico" id="season-ico" src="assets/ui/season-spring.png?v=1794068400" alt="" /><span id="season-label">春</span> · <img class="inline-ico" id="rent-ico" src="assets/ui/rent-wood.png?v=1794068400" alt=""/><span id="rent-label">賃金</span>剩 <em id="wage-val">5</em> 日</small>
        </span>
      </button>
      <button type="button" class="soft-pill economy" id="btn-economy" title="金幣與聲譽">
        <img class="pill-ico" src="assets/icons/coin-silver.png?v=1794068400" alt="" aria-hidden="true" />
        <span class="pill-stack">
          <strong class="gold-line">金幣 <b id="gold-val" class="pix-num" data-pix="87">87</b></strong>
          <small><img class="inline-ico" id="rank-ico" src="assets/badges/rank-copper.png?v=1794068400" alt="" /><img class="inline-ico" id="rep-trend" src="assets/ui/reputation-up.png?v=1794068400" alt="" /><img class="inline-ico" src="assets/ui/fame-star.png?v=1794068400" alt="" />聲譽 <b id="rep-val">中</b></small>

      </button>

        <div class="party-strip" id="party-strip-front">
          <button type="button" class="head-slot active" data-line="front" data-id="sword" data-job="劍士" title="見習冒險者 · 劍士">
            <img src="assets/heads/front-sword.png" alt="劍士" />
          </button>
          <button type="button" class="head-slot" data-line="front" data-id="tank" data-job="盾衛" title="見習冒險者 · 盾衛">
            <img src="assets/heads/front-tank.png" alt="盾衛" />
          </button>
          <button type="button" class="head-slot" data-line="front" data-id="spear" data-job="槍兵" title="見習冒險者 · 槍兵">
            <img src="assets/heads/front-spear.png" alt="槍兵" />

            <img class="prop prop-bed" src="assets/props/bed.png?v=1794068400" alt="" />
            <img class="prop prop-bathtub" src="assets/props/bathtub.png?v=1794068400" alt="" />
            <img class="prop prop-anvil" src="assets/icons/anvil.png?v=1794068400" alt="" />

            <img class="prop prop-cookpot" src="assets/icons/cookpot.png?v=1794068400" alt="" />

      </div>

      <aside class="side-rail back" aria-label="後衛">
        <div class="rail-tag">後衛 <img class="pos-rail" src="assets/party/pos-back.png?v=1794068400" alt=""/></div>
        <div class="party-strip" id="party-strip-back">
          <button type="button" class="head-slot active" data-line="back" data-id="mage" data-job="法師" title="見習冒險者 · 法師">
            <img src="assets/heads/back-mage.png" alt="法師" />

          <button type="button" class="head-slot" data-line="back" data-id="healer" data-job="治療" title="見習冒險者 · 治療">
            <img src="assets/heads/back-healer.png" alt="治療" />
          </button>
          <button type="button" class="head-slot" data-line="back" data-id="archer" data-job="弓手" title="見習冒險者 · 弓手">
            <img src="assets/heads/back-archer.png" alt="弓手" />

          <button type="button" class="head-slot" data-line="back" data-id="bard" data-job="吟遊" title="見習冒險者 · 吟遊">
            <img src="assets/heads/back-bard.png" alt="吟遊" />

    <div class="party-status-row" id="party-status-row" aria-label="異常狀態"></div>

    <!-- 對話＋橫排 3 格任務 -->
    <section class="mid-section">
      <div class="dialogue-panel">
        <div class="dialogue" id="dialogue">
          <img class="emoji-bubble" id="emoji-bubble" alt="" hidden />
          <img class="lily-mood" id="lily-mood" src="assets/heads/lily-mood-smile.png?v=1794068400" alt="" />
          <div class="dialogue-main">
            <div class="dialogue-name nameplate" id="dialogue-name">莉莉</div>
            <div class="dialogue-text" id="dialogue-text">（審批緊文件）有咩可以幫你？</div>
          </div>
        </div>
        <button type="button" class="act info tiny" id="btn-info" title="莉莉資料"><img src="assets/ui/info-i.png?v=1794068400" alt="資料"/></button>

        <button type="button" class="btn-util" id="btn-mail" title="信箱"><img id="mail-ico" src="assets/ui/mail-envelope.png?v=1794068400" alt=""/><span>信箱</span><img class="notif" id="mail-notif" src="assets/ui/notif-dot.png?v=1794068400" alt=""/></button>
        <button type="button" class="btn-util" id="btn-settings" title="設定"><img src="assets/ui/settings-gear.png?v=1794068400" alt=""/><span>設定</span></button>
        <button type="button" class="btn-util" id="btn-train" title="訓練"><img src="assets/icons/icon-dumbbell.png?v=1794068400" alt=""/><span>訓練</span></button>
        <button type="button" class="btn-util" id="btn-craft" title="工藝"><img src="assets/icons/anvil.png?v=1794068400" alt=""/><span>工藝</span></button>

        <button type="button" class="btn-refresh" id="btn-refresh-quests" title="刷新已完成委託">換一批</button>
      </div>
      <div class="quest-row" id="quest-row" aria-label="任務列表">
        <!-- 由 app.js 渲染 3 格 -->
      </div>
    </section>

      <div class="inv-header">
        <div class="inv-label">公會庫存 <span class="inv-hint" id="inv-hint">先揀任務，再派道具</span></div>
        <button type="button" class="btn-auto" id="btn-auto-items" title="自動選擇道具">自動選擇</button>
      </div>
            <div class="inventory" id="inventory">
